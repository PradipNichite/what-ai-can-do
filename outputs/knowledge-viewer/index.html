n it is explained in their own language and context. Students, parents, teachers, small business owners, and local-language creators. AI education should not feel like imported English jargon. Natural Marathi/Hindi/l", "metadata": {"Status": "Backlog idea.", "Parent topic": "[AI-Era Careers And Work](../topics/ai-era-careers-and-work.md)"}}, {"title": "Matrices: How Images Become Numbers", "path": "backlog/ideas/matrices-images-become-numbers.md", "category": "backlog", "status": "video-interactive", "doc_type": "", "next_action": "", "summary": "A photo looks visual to us, but to a computer it can become a grid of numbers. 11th/12th science students and students curious about AI/computer vision. Matrices often feel abstract. Image pixels make the idea concrete. 1. Student takes a selfie or photo of a ", "metadata": {"Status": "video-interactive", "Pipeline stage": "08 Video / Interactive", "Parent topic": "[Applied Mathematics In AI](../topics/applied-mathematics-ai.md)"}}, {"title": "No-Code Builder", "path": "backlog/ideas/no-code-builder.md", "category": "backlog", "status": "Backlog idea.", "doc_type": "", "next_action": "", "summary": "You can build useful websites, forms, dashboards, and automations without becoming a full software engineer. College students, small business owners, teachers, and professionals. No-code plus AI can help people solve local problems quickly.", "metadata": {"Status": "Backlog idea.", "Parent topic": "[AI-Era Careers And Work](../topics/ai-era-careers-and-work.md)"}}, {"title": "Optimization: How AI Improves Step By Step", "path": "backlog/ideas/optimization-ai-improves-step-by-step.md", "category": "backlog", "status": "Backlog idea.", "doc_type": "", "next_action": "", "summary": "AI improves by finding settings that reduce error, step by step. 11th/12th science students and early college learners. Optimization connects derivatives, error, training, and real AI learning into one story. 1. AI starts on a hill with high error.", "m yle-corrected preview before spending Runway credits on all final clips."}}];
    const search = document.querySelector("#search");
    const category = document.querySelector("#category");
    const status = document.querySelector("#status");
    const cards = document.querySelector("#cards");
    const empty = document.querySelector("#empty");

    function unique(values) {
      return [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
    }

    function fillSelect(el, label, values) {
      el.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function matches(doc) {
      const q = search.value.trim().toLowerCase();
      const haystack = [doc.title, doc.path, doc.category, doc.status, doc.doc_type, doc.summary, doc.next_action].join(" ").toLowerCase();
      return (!q || haystack.includes(q))
        && (!category.value || doc.category === category.value)
        && (!status.value || doc.status === status.value);
    }

    function render() {
      const filtered = docs.filter(matches);
      cards.innerHTML = filtered.map(doc => {
        const pills = [
          doc.category ? `<span class="pill">${escapeHtml(doc.category)}</span>` : "",
          doc.status ? `<span class="pill status">${escapeHtml(doc.status)}</span>` : "",
          doc.doc_type ? `<span class="pill">${escapeHtml(doc.doc_type)}</span>` : ""
        ].join("");
        return `<article class="card">
          <div class="meta">${pills}</div>
          <h2>${escapeHtml(doc.title)}</h2>
          <p class="summary">${escapeHtml(doc.summary || doc.next_action || "No summary available yet.")}</p>
          <div class="path">${escapeHtml(doc.path)}</div>
          <a href="../../${encodeURI(doc.path)}">Open source</a>
        </article>`;
      }).join("");
      empty.hidden = filtered.length !== 0;
      document.querySelector("#total").textContent = docs.length;
      document.querySelector("#visible").textContent = filtered.length;
      document.querySelector("#categories").textContent = unique(docs.map(d => d.category)).length;
      document.querySelector("#withStatus").textContent = docs.filter(d => d.status).length;
    }

    fillSelect(category, "All categories", unique(docs.map(d => d.category)));
    fillSelect(status, "All statuses", unique(docs.map(d => d.status)));
    [search, category, status].forEach(el => el.addEventListener("input", render));
    render();
  </script>
